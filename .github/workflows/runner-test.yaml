name: Runner Test

on:
  push:
    branches:
      - main

jobs:
  test-runner:
    runs-on: self-hosted
    
    env:
      KUBECONFIG: /home/roi/.kube/config

    steps:
      - name: Check runner
        run: |
          echo "Runner works!"
          hostname
          whoami
          helm version
          kubectl version --client
          kubectl get nodes
          helm list -A
          kubectl get pods -A
